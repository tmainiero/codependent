%% regression-test.cfg -- codependent project overrides
%%
%% Override \END to write the END-TEST-LOG marker without calling
%% \@@end.  codependent tests rely on \end{document} running
%% \AtEndDocument hooks (which write the .cdp file).  The standard
%% regression-test.tex \END terminates TeX before those hooks fire.
%%
%% l3build stops capturing at END-TEST-LOG regardless, so any
%% log output after \END is simply ignored in the .tlg comparison.
\def\END{%
  \ifnum\currentgrouplevel>0 %
    \LONGTYPEOUT{Bad grouping: \the\currentgrouplevel!}%
  \fi
  \ifnum\currentiflevel>1 %
    \LONGTYPEOUT{Bad conditionals: \the\numexpr\currentiflevel-1!}%
  \fi
  \LONGTYPEOUT{^^JEND-TEST-LOG^^J}%
}
